name: CI/CD Docker - Voting App

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Image Tag
        run: |
          if [ "${{ env.DOCKERHUB_USERNAME }}" != "" ]; then
            echo "IMAGE_TAG=${{ env.DOCKERHUB_USERNAME }}/voting-app:latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=voting-app:latest" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_TAG }} .

      - name: Run Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_TAG }}
          only-fixed: true

      - name: Push Docker image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: docker push ${{ env.IMAGE_TAG }}
