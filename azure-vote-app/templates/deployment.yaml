apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      containers:
        - name: azure-vote-front
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: REDIS
              value: "{{ .Values.redis.host }}"
            - name: VOTE1VALUE
              value: "{{ .Values.vote1Value }}"
            - name: VOTE2VALUE
              value: "{{ .Values.vote2Value }}"
            - name: TITLE
              value: "{{ .Values.title }}"
